# PNC & PSS Visitor Check-In — nginx server block template.
#
# Single-domain setup: nginx serves the built frontend as static files at
# "/" and reverse-proxies "/api" and "/health" to the Node API on
# localhost:8000. Because it's all one origin, the frontend's
# VITE_API_BASE_URL can just be "https://YOUR_DOMAIN/api" and no CORS
# headers are needed at all — simpler and slightly more secure than a
# cross-origin setup.
#
# Copy to /etc/nginx/sites-available/pnc-visitor-app, symlink into
# sites-enabled, replace YOUR_DOMAIN and the two absolute paths below, then
# `sudo nginx -t && sudo systemctl reload nginx`.
# Run `sudo certbot --nginx -d YOUR_DOMAIN` afterwards — it rewrites this
# file in place to add the certificate + a :443 server block + the
# http->https redirect, so this file only defines the plain :80 block.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Absolute path to the frontend's built output (from `npm run build`
    # in the project root — NOT the server/ folder).
    root /var/www/pnc-visitor-app/dist;
    index index.html;

    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vue Router history mode: any path that isn't a real static file falls
    # back to index.html so client-side routing handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets; index.html itself is never cached
    # so deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy to the Node API (see deploy/pnc-visitor-api.service).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}
